<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kitchen display</title><link rel="stylesheet" href="/style.css"><script src="/icons.js" defer></script><script src="/hls.min.js" defer></script><script src="/appearance.js" defer></script><script src="/night-mode.js" defer></script><script src="/time-logic.js" defer></script><script src="/app.js" defer></script><script src="/time-tools.js" defer></script></head>
<body data-theme="dark"><script src="/cast.js"></script><main class="dashboard">
<header class="masthead"><button id="open-school" class="date-heading" type="button" title="School morning" aria-label="Open school morning countdowns"><span id="weekday" class="eyebrow"></span><span id="date" class="date-text"></span></button><button id="open-time-tools" class="clock" type="button" title="Timers and stopwatch" aria-label="Open timers and stopwatch"><time id="clock"></time><span id="ampm"></span><span id="timer-badge" class="timer-badge" hidden aria-hidden="true"></span></button></header>
<section id="cameras" class="cameras" aria-label="Live cameras"><button id="close-cameras" class="icon-button view-close" title="Back to calendar" aria-label="Back to calendar" hidden><i data-lucide="x"></i></button></section>
<section class="week-section"><div class="section-heading"><div><p class="eyebrow">THIS WEEK</p><h2 id="title">Our week</h2></div><div class="week-actions"><span id="week-range"></span><div class="night-controls" role="group" aria-label="Night mode"><button id="night-toggle" class="icon-button" type="button" title="Turn night mode on" aria-label="Turn night mode on" aria-pressed="false" disabled><i data-lucide="moon"></i></button><button id="night-auto" class="icon-button" type="button" title="Following night schedule" aria-label="Following night schedule" disabled><i data-lucide="clock-3"></i></button></div><button id="refresh" class="icon-button" title="Refresh calendars" aria-label="Refresh calendars"><i data-lucide="refresh-cw"></i></button><a class="icon-button" href="/settings" title="Settings" aria-label="Settings"><i data-lucide="settings-2"></i></a></div></div><div class="calendar-filters"><div id="legend" class="legend" role="group" aria-label="Calendar visibility"></div><div class="calendar-bulk" role="group" aria-label="All calendars"><button id="show-calendars" class="icon-button" type="button" title="Show all calendars" aria-label="Show all calendars" disabled><i data-lucide="eye"></i></button><button id="hide-calendars" class="icon-button" type="button" title="Hide all calendars" aria-label="Hide all calendars" disabled><i data-lucide="eye-off"></i></button></div></div><div id="week" class="week-grid"></div><p id="connection-state" class="connection-state"></p></section>
<section class="upcoming"><div class="section-heading"><h2>Coming up</h2><span id="month-label"></span></div><div id="upcoming" tabindex="0" role="region" aria-label="Upcoming weeks and months"></div></section>
</main><dialog id="details"><div class="dialog-heading"><h2 id="details-title"></h2><button id="close-details" class="icon-button" title="Close" aria-label="Close"><i data-lucide="x"></i></button></div><div id="details-events"></div></dialog></body></html>
