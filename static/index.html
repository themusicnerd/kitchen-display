<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kitchen display</title><link rel="stylesheet" href="/style.css"><script src="/icons.js" defer></script><script src="/hls.min.js" defer></script><script src="/app.js" defer></script></head>
<body data-theme="dark"><script src="/night-mode.js" defer></script><main class="dashboard">
<header class="masthead"><div><p id="weekday" class="eyebrow"></p><h1 id="date"></h1></div><div class="clock"><time id="clock"></time><span id="ampm"></span></div></header>
<section id="cameras" class="cameras" aria-label="Live cameras"><button id="close-cameras" class="icon-button" title="Back to calendar" aria-label="Back to calendar" hidden><i data-lucide="x"></i></button></section>
<section class="week-section"><div class="section-heading"><div><p class="eyebrow">THIS WEEK</p><h2 id="title">Our week</h2></div><div class="week-actions"><span id="week-range"></span><button id="refresh" class="icon-button" title="Refresh calendars" aria-label="Refresh calendars"><i data-lucide="refresh-cw"></i></button><a class="icon-button" href="/settings" title="Settings" aria-label="Settings"><i data-lucide="settings-2"></i></a></div></div><div id="legend" class="legend"></div><div id="week" class="week-grid"></div><p id="connection-state" class="connection-state"></p></section>
<section class="upcoming"><div class="section-heading"><h2>Coming up</h2><span id="month-label"></span></div><div id="upcoming" tabindex="0" role="region" aria-label="Upcoming weeks and months"></div></section>
</main><dialog id="details"><div class="dialog-heading"><h2 id="details-title"></h2><button id="close-details" class="icon-button" title="Close" aria-label="Close"><i data-lucide="x"></i></button></div><div id="details-events"></div></dialog></body></html>
