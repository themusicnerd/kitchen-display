<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen timer</title><link rel="stylesheet" href="/cast/common.css"><link rel="stylesheet" href="/cast/receiver.css"><script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js" defer></script><script src="/cast/time-logic.js" defer></script><script src="/cast/receiver.js" defer></script></head>
<body data-theme="dark"><main class="tv-timer" id="tv-timer" hidden><section class="tv-timer-heading"><h1 id="tv-title"></h1><p id="tv-at"></p><p id="tv-state" role="status"></p></section><section class="tv-dial-space" id="tv-dial-space" aria-label="Visual countdown"><div id="activity-dial" class="activity-dial"><div id="activity-pie" class="activity-pie" role="progressbar" aria-label="Final hour remaining" aria-valuemin="0" aria-valuemax="60"></div><div id="activity-minute-ring" class="activity-minute-ring" role="progressbar" aria-label="Seconds remaining in this minute" aria-valuemin="0" aria-valuemax="60"></div><span class="dial-mark dial-mark-top" aria-hidden="true">60</span><span class="dial-mark dial-mark-right" aria-hidden="true">15</span><span class="dial-mark dial-mark-bottom" aria-hidden="true">30</span><span class="dial-mark dial-mark-left" aria-hidden="true">45</span><div class="activity-focus-clock"><output id="activity-focus-remaining" role="timer"></output></div></div></section></main><p id="tv-message" class="tv-message" role="status">Connecting to timer...</p></body></html>
