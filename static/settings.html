<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kitchen display settings</title><link rel="stylesheet" href="/style.css"><script src="/icons.js" defer></script><script src="/settings.js" defer></script><script src="/accounts.js" defer></script></head>
<body class="settings-page" data-theme="dark"><main class="settings-shell"><header class="settings-heading"><a href="/" class="icon-button" title="Back to display" aria-label="Back to display"><i data-lucide="arrow-left"></i></a><h1>Display settings</h1><button id="save" class="primary"><i data-lucide="save"></i>Save</button></header><p id="save-status" role="status"></p>
<form id="settings-form"><section class="settings-section"><h2>Layout</h2><div class="form-grid">
<label>Calendar heading<input id="title" maxlength="60"></label><label>Timezone<select id="timezone"><option>Australia/Sydney</option><option>Australia/Brisbane</option><option>Australia/Melbourne</option><option>Australia/Adelaide</option><option>Australia/Darwin</option><option>Australia/Perth</option><option>Australia/Hobart</option></select></label>
<label>Current week height <output id="weekHeight-value"></output><input id="weekHeight" type="range" min="380" max="1000" step="20"></label><label>Upcoming weeks<input id="upcomingWeeks" type="number" min="1" max="4"></label>
<label>Font weight <output id="fontWeight-value"></output><input id="fontWeight" type="range" min="300" max="700" step="10"></label><label>Appearance<select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
</div></section>
<section class="settings-section"><h2>Night mode</h2><div class="form-grid"><label class="checkbox"><input type="checkbox" id="nightEnabled">Scheduled dimming</label><label>Brightness <output id="nightBrightness-value"></output><input id="nightBrightness" type="range" min="5" max="100" step="5"></label><label>Start time<input id="nightStart" type="time" required></label><label>End time<input id="nightEnd" type="time" required></label></div><p class="account-status">Uses the display timezone. Visual dimming only; monitor backlight is unchanged.</p><button type="button" id="preview-night" class="secondary"><i data-lucide="moon"></i>Preview dimming</button></section>
<section class="settings-section"><div class="section-heading"><h2>Cameras</h2><button type="button" id="add-camera" class="secondary"><i data-lucide="plus"></i>Add camera</button></div><div class="form-grid"><label class="checkbox"><input type="checkbox" id="showCamera">Show cameras</label><label>Picture framing<select id="cameraFit"><option value="contain">Full picture</option><option value="cover">Fill camera strip</option></select></label></div><p id="camera-settings-status" class="account-status" role="status"></p><div id="camera-sources"></div><button type="button" id="save-cameras" class="secondary"><i data-lucide="save"></i>Apply camera connections</button></section>
<section class="settings-section"><h2>Calendar accounts</h2><div class="account-connect"><label>Provider<select id="account-provider"><option value="google">Google</option><option value="microsoft">Microsoft 365 / Outlook</option></select></label><label>Email address <span class="optional">(optional)</span><input id="account-hint" type="email" autocomplete="email"></label><button type="button" class="secondary" id="connect-account"><i data-lucide="user-plus"></i>Sign in</button></div><p id="account-status" class="account-status" role="status"></p><div id="connected-accounts"></div>
<details id="provider-setup"><summary>Provider app setup</summary><div class="provider-form"><h3>Google</h3><label>Client ID<input id="google-client-id" autocomplete="off"></label><label>Client secret<input id="google-client-secret" type="password" autocomplete="off"></label><label>Authorised redirect URI<input readonly value="http://localhost:8090/auth/google/callback"></label><a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noreferrer">Google Cloud credentials</a></div><div class="provider-form"><h3>Microsoft</h3><label>Application (client) ID<input id="microsoft-client-id" autocomplete="off"></label><label>Client secret <span class="optional">(Web registration only)</span><input id="microsoft-client-secret" type="password" autocomplete="off"></label><label>Redirect URI<input readonly value="http://localhost:8090/auth/microsoft/callback"></label><a href="https://entra.microsoft.com/" target="_blank" rel="noreferrer">Microsoft Entra app registrations</a></div><button type="button" id="save-providers" class="secondary"><i data-lucide="save"></i>Save provider setup</button></details></section>
<section class="settings-section"><div class="section-heading"><h2>Calendars</h2><button type="button" id="add-calendar" class="secondary"><i data-lucide="plus"></i>Add iCalendar feed</button></div><label class="checkbox privacy-setting"><input type="checkbox" id="hidePrivateEvents">Hide private and confidential events</label><div id="calendar-sources"></div></section>
</form></main><dialog id="calendar-picker"><div class="dialog-heading"><h2>Select calendars</h2><button type="button" id="close-picker" class="icon-button" title="Close" aria-label="Close"><i data-lucide="x"></i></button></div><div id="available-calendars"></div><p id="picker-status" class="account-status" role="status"></p><button type="button" id="save-selection" class="primary"><i data-lucide="check"></i>Apply selection</button></dialog><dialog id="icon-picker"><div class="dialog-heading"><h2>Calendar icon</h2><button type="button" id="close-icon-picker" class="icon-button" title="Close" aria-label="Close"><i data-lucide="x"></i></button></div><div id="icon-options" class="icon-options"></div></dialog></body></html>
